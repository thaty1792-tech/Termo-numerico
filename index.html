<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termo Numérico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Termo Numérico</h1>
    </header>

    <section>
        <form id="jogo-form" onsubmit="event.preventDefault(); verificarPalavra();">
            <div id="caixas" class="caixas-container"></div>
            <button type="submit" style="display: none;"></button>
        </form>
        
        <div class="controles">
            <button class="btn-reiniciar" onclick="iniciarJogo()">Reiniciar Jogo</button>
            <button class="btn-ajuda" onclick="mostrarPopup()">Dúvidas</button>
        </div>

        <div id="teclado-virtual" class="teclado-container">
            <div class="teclado-linha">
                <button class="tecla" onclick="digitarNoTeclado('1')">1</button>
                <button class="tecla" onclick="digitarNoTeclado('2')">2</button>
                <button class="tecla" onclick="digitarNoTeclado('3')">3</button>
                <button class="tecla" onclick="digitarNoTeclado('4')">4</button>
                <button class="tecla" onclick="digitarNoTeclado('5')">5</button>
            </div>
            <div class="teclado-linha">
                <button class="tecla" onclick="digitarNoTeclado('6')">6</button>
                <button class="tecla" onclick="digitarNoTeclado('7')">7</button>
                <button class="tecla" onclick="digitarNoTeclado('8')">8</button>
                <button class="tecla" onclick="digitarNoTeclado('9')">9</button>
                <button class="tecla" onclick="digitarNoTeclado('0')">0</button>
            </div>
            <div class="teclado-linha">
                <button class="tecla tecla-especial" onclick="apagarNoTeclado()">⌫</button>
                <button class="tecla tecla-especial" onclick="verificarPalavra()">ENTER</button>
            </div>
        </div>

        <div id="popup" class="popup">
            <h3>Regras do Jogo</h3>
            <p>Descubra o código secreto de 5 números:</p>
            <ul>
                <li><span style="color: green; font-weight: bold;">Verde</span>: Número correto na posição correta.</li>
                <li><span style="color: #d4d400; font-weight: bold;">Amarelo</span>: O número existe, mas em outra posição.</li>
                <li><span style="color: #787c7e; font-weight: bold;">Cinza</span>: O número não pertence ao código.</li>
            </ul>
            <p>Digite os números e pressione <strong>Enter</strong> para verificar.</p>
            <button onclick="fecharPopup()">Fechar</button>
        </div>

        <div id="resultado"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
